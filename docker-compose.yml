# ==============================================================================
# Docker Compose Orchestration: Telco Churn Prediction Architecture
# Connects FastAPI inference backend and Streamlit intelligence dashboard
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI ML Prediction & SHAP Local Attribution REST Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: churn-prediction-backend:latest
    container_name: churn-prediction-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_PATH=/app/models/best_churn_model.joblib
      - AUDIT_REPORT_PATH=/app/models/model_comparison_report.json
    volumes:
      # Read-only mount preserving model artifact immutability
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - churn-network

  # ----------------------------------------------------------------------------
  # Streamlit Real-Time Decision Analytics Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: churn-prediction-frontend:latest
    container_name: churn-prediction-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Inter-container DNS communication pointing to backend service
      - API_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - churn-network

networks:
  churn-network:
    driver: bridge
